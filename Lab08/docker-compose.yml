# Airflow 2.10.4 + Python 3.11 — omija SIGSEGV Gunicorna na macOS.
# Uruchomienie: docker compose up
# UI: http://localhost:8080 (admin / admin)

services:
  airflow:
    image: apache/airflow:2.10.4-python3.11
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      # Wersje zgodne z README (constraints 2.10.4 / Python 3.11)
      _PIP_ADDITIONAL_REQUIREMENTS: >-
        scikit-learn==1.6.1
        pandas==2.2.3
        numpy==1.26.4
        joblib==1.4.2
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    ports:
      - "8080:8080"
    # Uid hosta — zapis modeli do ./models bez problemów z uprawnieniami (macOS/Linux)
    user: "${AIRFLOW_UID:-50000}:0"
    command: >
      bash -c "
      rm -f /opt/airflow/airflow.db &&
      airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
      airflow webserver --port 8080 &
      sleep 5 &&
      airflow scheduler
      "
